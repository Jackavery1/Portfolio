<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#03040f" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
    <title>Hors ligne · Joris Martinez</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100dvh;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top, 0)) max(1.5rem, env(safe-area-inset-right, 0))
          max(1.5rem, env(safe-area-inset-bottom, 0)) max(1.5rem, env(safe-area-inset-left, 0));
        background: #03040f;
        color: #c8d4ff;
        font-family: 'Segoe UI', system-ui, sans-serif;
        text-align: center;
      }

      main {
        max-width: 28rem;
        border: 1px solid #1e3080;
        border-radius: 4px;
        padding: 2rem 1.5rem;
        box-shadow: 0 0 40px rgba(30, 48, 128, 0.25);
      }

      h1 {
        font-size: clamp(1.1rem, 4vw, 1.35rem);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #6b9fff;
        margin-bottom: 1rem;
      }

      p {
        line-height: 1.6;
        margin-bottom: 1.25rem;
        color: #9fb0d9;
      }

      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0.65rem 1.25rem;
        border: 1px solid #6b9fff;
        border-radius: 3px;
        color: #03040f;
        background: #6b9fff;
        text-decoration: none;
        font-weight: 600;
        letter-spacing: 0.06em;
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Mode hors ligne</h1>
      <p>
        Connexion indisponible. Les pages déjà visitées peuvent s’afficher ; sinon, réessayez
        lorsque le réseau revient.
      </p>
      <a href="index.html">Retour à l’accueil</a>
    </main>
  </body>
</html>
