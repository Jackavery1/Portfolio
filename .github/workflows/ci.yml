name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vérifier format des commits (Conventional Commits)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          MESSAGES="$(git log --format=%s origin/main..HEAD)"
          echo "$MESSAGES" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build)(\([a-z0-9._-]+\))?: .+'
          INVALIDES="$(echo "$MESSAGES" | grep -Ev '^(feat|fix|chore|docs|refactor|test|ci|build)(\([a-z0-9._-]+\))?: .+' || true)"
          if [ -n "$INVALIDES" ]; then
            echo "Commits invalides detectes :"
            echo "$INVALIDES"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Audit dependencies (production, high)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: .dist-staging/
          retention-days: 1

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  lighthouse:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npm run test:lhci

  deploy:
    needs: [validate, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234b4f18a22b3d1e57 # v4.1.8
        with:
          name: dist
          path: .dist-staging

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.dist-staging
