name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vérifier format des commits (Conventional Commits)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          MESSAGES="$(git log --format=%s origin/main..HEAD)"
          echo "$MESSAGES" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build)(\([a-z0-9._-]+\))?: .+'
          INVALIDES="$(echo "$MESSAGES" | grep -Ev '^(feat|fix|chore|docs|refactor|test|ci|build)(\([a-z0-9._-]+\))?: .+' || true)"
          if [ -n "$INVALIDES" ]; then
            echo "Commits invalides detectes :"
            echo "$INVALIDES"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Audit dependencies (production, high)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Validate HTML (dist)
        run: npm run validate:html:dist

      - name: Préparer artefact (hors .gitignore)
        run: cp -r .dist-staging deploy-output

      - name: Upload dist artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: dist
          path: deploy-output/
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Download dist artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: .dist-staging

      - name: E2E tests
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npx playwright test --project=responsive-mobile-portrait --project=responsive-mobile-landscape --project=responsive-tablet --project=responsive-webkit --project=responsive-firefox --project=responsive-desktop-chrome --project=desktop-chrome

  lighthouse:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: |
          for attempt in 1 2 3; do
            echo "Lighthouse mobile — tentative ${attempt}/3"
            npm run test:lhci && exit 0
            if [ "${attempt}" -lt 3 ]; then
              echo "Échec Lighthouse, nouvelle tentative dans 15s…"
              sleep 15
            fi
          done
          exit 1

      - name: Lighthouse CI desktop (smoke)
        run: npm run test:lhci:desktop

  deploy:
    needs: [validate, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dist
          path: deploy-output

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: deploy-output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
