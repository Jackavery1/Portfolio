name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vérifier format des commits (Conventional Commits)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          MESSAGES="$(git log --format=%s origin/main..HEAD)"
          echo "$MESSAGES" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build)(\([a-z0-9._-]+\))?: .+'
          INVALIDES="$(echo "$MESSAGES" | grep -Ev '^(feat|fix|chore|docs|refactor|test|ci|build)(\([a-z0-9._-]+\))?: .+' || true)"
          if [ -n "$INVALIDES" ]; then
            echo "Commits invalides detectes :"
            echo "$INVALIDES"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Audit dependencies (production, high)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Mesure bundle (plafonds CI)
        run: npm run measure:check

      - name: Validate HTML (dist)
        run: npm run validate:html:dist

      - name: Préparer artefact (hors .gitignore)
        run: cp -r .dist-staging deploy-output

      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: deploy-output/
          if-no-files-found: error
          retention-days: 1

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit firefox

      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: .dist-staging

      - name: E2E tests
        env:
          PLAYWRIGHT_SKIP_BUILD: '1'
        run: npx playwright test --project=responsive-mobile-portrait --project=responsive-mobile-landscape --project=responsive-tablet --project=responsive-webkit --project=responsive-firefox --project=responsive-desktop-chrome --project=desktop-chrome

  lighthouse:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: |
          for attempt in 1 2 3; do
            echo "Lighthouse mobile — tentative ${attempt}/3"
            npm run test:lhci && exit 0
            if [ "${attempt}" -lt 3 ]; then
              echo "Échec Lighthouse, nouvelle tentative dans 15s…"
              sleep 15
            fi
          done
          exit 1

      - name: Lighthouse CI desktop (smoke)
        run: |
          for attempt in 1 2 3; do
            echo "Lighthouse desktop — tentative ${attempt}/3"
            npm run test:lhci:desktop && exit 0
            if [ "${attempt}" -lt 3 ]; then
              echo "Échec Lighthouse desktop, nouvelle tentative dans 15s…"
              sleep 15
            fi
          done
          exit 1

  deploy:
    needs: [validate, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: deploy-output

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: deploy-output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
