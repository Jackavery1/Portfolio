name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Vérifier format des commits (Conventional Commits)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          MESSAGES="$(git log --format=%s origin/main..HEAD)"
          echo "$MESSAGES" | grep -Eq '^(feat|fix|chore|docs|refactor|test|ci|build)(\([a-z0-9._-]+\))?: .+'
          INVALIDES="$(echo "$MESSAGES" | grep -Ev '^(feat|fix|chore|docs|refactor|test|ci|build)(\([a-z0-9._-]+\))?: .+' || true)"
          if [ -n "$INVALIDES" ]; then
            echo "Commits invalides detectes :"
            echo "$INVALIDES"
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Validate HTML
        run: npm run validate:html

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm test

      - name: Test coverage
        run: npm run test:coverage

      - name: Audit dependencies (production, high)
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Validate HTML (dist)
        run: npm run validate:html:dist

      - name: Upload dist artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: dist
          path: .dist-staging/
          retention-days: 1

  e2e:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

  lighthouse:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "18"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lighthouse CI
        run: npm run test:lhci

  deploy:
    needs: [validate, e2e, lighthouse]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444306234b4f18a22b3d1e57 # v4.1.8
        with:
          name: dist
          path: .dist-staging

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./.dist-staging
