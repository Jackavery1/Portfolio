<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- PAGE_META_START -->
    <meta
      name="description"
      content="Projets web : LSF (Express/MongoDB), Floppy Bird (PWA), Dernière Ligne (Tetris narratif), GameHub, site WordPress HubTraining, Pixel Quest."
    />
    <meta property="og:title" content="Projets · Joris Martinez" />
    <meta
      property="og:description"
      content="WORK — projets développeur web : full-stack, jeu Phaser, client réel WordPress."
    />
    <meta name="twitter:title" content="Projets · Joris Martinez" />
    <meta
      name="twitter:description"
      content="Sélection de projets web — portfolio Joris Martinez."
    />
    <!-- PAGE_META_END -->

    <title>Projets · Joris Martinez</title>

    <!-- HEAD_DEV_MIN : retiré au build ; permet d'ouvrir les .html à la racine sans build -->
    <link rel="stylesheet" href="style.css" />
    <!-- /HEAD_DEV_MIN -->
    <!-- HEAD_COMMON -->
  </head>

  <body data-section-id="projets">
    <a class="lien-evitement" href="#js-contenu-principal">Aller au contenu principal</a>

    <div id="partial-crt"></div>

    <div id="partial-marquee"></div>

    <div class="ecran">
      <div id="partial-nav"></div>

      <main id="js-contenu-principal" tabindex="-1">
        <section id="projets" class="section" aria-label="Projets">
          <h1 class="titre-section"><span class="pixel-accent">▶</span> SELECT YOUR STAGE</h1>

          <nav
            class="projets-sommaire"
            id="js-projets-sommaire"
            aria-label="Navigation rapide projets"
          ></nav>

          <div
            class="grille-projets"
            id="js-grille-projets"
            aria-busy="true"
            aria-live="polite"
          ></div>
          <!-- cartes générées depuis js/config/projects.js -->

          <!-- Bouton Dojo caché -->
          <div class="work-dojo-zone">
            <a class="bouton-dojo" href="dojo.html" id="js-btn-dojo">
              <span aria-hidden="true">⚡</span> DOJO — EXERCICES &amp; PROJETS MINEURS
            </a>
          </div>
        </section>
      </main>

      <div id="partial-footer"></div>
    </div>
    <!-- fin .ecran -->
    <!-- Modal prévisualisation projet -->
    <div
      class="modal-overlay"
      id="js-modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="js-modal-titre"
      hidden
    >
      <div class="modal-boite">
        <div class="modal-entete">
          <span class="modal-titre" id="js-modal-titre">NOM DU PROJET</span>
          <button type="button" class="modal-fermer" id="js-modal-fermer" aria-label="Fermer">
            ✕
          </button>
        </div>
        <div class="modal-contenu">
          <figure class="modal-apercu">
            <img class="modal-img" id="js-modal-img" src="" alt="" hidden />
          </figure>
          <p class="modal-desc" id="js-modal-desc"></p>
          <p class="modal-lien" id="js-modal-lien" hidden></p>
          <div class="modal-tech" id="js-modal-tech"></div>
        </div>
      </div>
    </div>

    <div id="partial-popup-hs"></div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
